name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest

    steps:
      # The Marketplace catalog uses this action and the root hacs.json manifest.
      # https://contributors.home-assistant.io/marketplace/reference/validation/
      - name: Validate for the Marketplace catalog
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
